services:
  weather_api:
    name: weather_api
    description: 查询指定城市的天气预报
    url: https://api.caiyunapp.com/v2.6/TAkhjf8d1nlSlspN/101.6656,39.2072/realtime
    method: POST
    headers:
      Content-Type: application/json
    request_template:
      city: '{city}'
      days: 3

  search_images:
    name: search_images
    description: 根据自然语言描述语义检索无人机影像。输入查询文本（如"拔节期水稻田影像"、"有病害的田块"），返回匹配的影像列表（含缩略图URL、瓦片URL、地理范围、VLM描述等）。
    url: http://host.docker.internal:8005/api/images/search
    method: POST
    headers:
      Content-Type: application/json
    request_template:
      query: '{query}'
      limit: 5
    timeout: 30.0

  get_image_detail:
    name: get_image_detail
    description: 根据影像ID获取无人机影像的完整元数据，包括GeoTIFF参数（分辨率、波段、坐标系）、飞行信息、VLM语义描述、瓦片URL等。
    url: http://host.docker.internal:8005/api/images/{image_id}
    method: GET
    timeout: 15.0
