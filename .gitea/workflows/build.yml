name: Build and Push Backend

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    services:
      dind:
        image: docker:27-dind
        options: --privileged
    env:
      DOCKER_HOST: tcp://dind:2375
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Gitea Registry
        run: |
          echo "${{ secrets.GITEA_REGISTRY_TOKEN }}" | docker login 172.17.1.130:3000 \
            -u "${{ secrets.GITEA_REGISTRY_USER }}" --password-stdin

      - name: Build image
        run: |
          docker build -t 172.17.1.130:3000/phenomics/phenomics-agent-backend:${{ gitea.run_number }} .

      - name: Push image (run number tag)
        run: |
          docker push 172.17.1.130:3000/phenomics/phenomics-agent-backend:${{ gitea.run_number }}

      - name: Tag and push as latest
        run: |
          docker tag 172.17.1.130:3000/phenomics/phenomics-agent-backend:${{ gitea.run_number }} \
                     172.17.1.130:3000/phenomics/phenomics-agent-backend:latest
          docker push 172.17.1.130:3000/phenomics/phenomics-agent-backend:latest

      - name: Trigger deploy
        run: |
          curl -fsS -X POST \
            "http://172.17.1.130:3000/api/v1/repos/${{ secrets.DEPLOY_REPO }}/dispatches" \
            -H "Authorization: token ${{ secrets.GITEA_REGISTRY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"deploy","client_payload":{"backend_tag":"${{ gitea.run_number }}","frontend_tag":"latest"}}'
