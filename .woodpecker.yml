when:
  - event: manual
  - event: push
    branch: master

steps:
  - name: build
    image: plugins/docker
    settings:
      repo: phenomics-agent-backend
      tags: ${CI_BUILD_NUMBER}
      dry_run: true
      dockerfile: Dockerfile
      context: .

  - name: deploy
    image: docker
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
      - name: deploy-dir
        path: /home/root01/phenomics-agent
    commands:
      - cat /run/secrets/env_file > /home/root01/phenomics-agent/.env
      - cat /run/secrets/backend_config > /home/root01/phenomics-agent/backend-config/config.yaml
      - cd /home/root01/phenomics-agent
      - docker compose -f docker-compose.backend.yml up -d --build phenomics-backend
      - docker image prune -f

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock
  - name: deploy-dir
    host:
      path: /home/root01/phenomics-agent

secrets:
  - name: env_file
    secret: env_file
  - name: backend_config
    secret: backend_config
