services:
  phenomics-backend:
    image: phenomics-agent-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phenomics-backend
    ports:
      - "8007:8001"   # 主机 8007 → 容器 8001（8001 已被 paperrag-query 占用）
    env_file:
      - .env
    volumes:
      - ./backend-config/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    networks:
      - infra         # 访问 postgres、minio、milvus 等基础设施
      - phenomics-net # 与 phenomics-frontend 通信

# =============================================================================
# 网络
# =============================================================================
networks:
  infra:
    name: infra
    external: true
  phenomics-net:
    name: phenomics-net
    external: true
